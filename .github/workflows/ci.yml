name: CI

on:
  push:
  pull_request:
  # Weekly as well: new advisories appear against dependencies that have not
  # changed, and the audit below should find them without waiting for a push.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  checks:
    name: Lint, format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: pip install -r requirements-dev.lock.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      # Both locks are fully pinned, so they are audited as written, without
      # resolving anything. Any known advisory fails the build.
      - name: Audit the locked dependencies
        run: >-
          pip-audit --no-deps --disable-pip
          -r requirements.lock.txt -r requirements-dev.lock.txt

  browser:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.lock.txt
      - run: playwright install --with-deps chromium
      - run: pytest tests/e2e --browser chromium  # includes axe-core accessibility scans
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  container:
    name: Docker build and health smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t project-reporting-builder:ci .
      - name: Start container
        run: docker run -d --name prb -p 8000:8000 project-reporting-builder:ci
      - name: Wait for /healthz
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz | grep -q '"status":"ok"'; then
              echo "healthy after ${attempt} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs prb; exit 1
      - name: Check the page and its assets respond
        run: |
          curl -fsS http://localhost:8000/ > /dev/null
          curl -fsS http://localhost:8000/static/css/app.css > /dev/null
          curl -fsS http://localhost:8000/static/js/main.js > /dev/null
      - name: Confirm the container does not run as root
        run: test "$(docker exec prb id -u)" != "0"
      - name: Confirm the security headers are sent and the server is not named
        run: |
          headers="$(curl -fsSI http://localhost:8000/)"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          ! echo "$headers" | grep -qi '^server:'
      - name: Stop container
        if: always()
        run: docker rm -f prb || true
